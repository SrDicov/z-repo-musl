name: Z Repo Autobuild (musl)

# NOTE: no `container:` here on purpose. The void-musl image is musl-linked
# and cannot run GitHub's glibc-linked action runtimes (node) nor has bash.
# We run on Ubuntu and use docker manually for the build only (repo-neko
# pattern); gh/publish orchestration stays on the host.
on:
  push:
    branches: [master, main]
    paths:
      - '.github/**'
      - 'keys/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Build only these (comma/space separated, empty = auto-detect)'
        required: false
        default: ''
      sync_only:
        description: 'Skip build, only resign repodata and re-publish'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      resign:
        description: 'Wipe old signatures and sign everything from scratch (key rotation)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force:
        description: 'Rebuild all packages even if current'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '0 3 * * *' # daily: poll z-packages
  repository_dispatch:
    types: [z-packages-update]

env:
  ARCH: x86_64-musl
  REPO_TAG: stable
  GH_REPO: ${{ github.repository }} # gh must target this repo, not clones
  MUSL_IMAGE: ghcr.io/void-linux/void-musl:latest

concurrency:
  group: z-repo-musl-autobuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Detect outdated packages
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.detect.outputs.pkgs }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: List release assets (no download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view "$REPO_TAG" --json assets \
            --jq '.assets[].name' > assets.txt 2>/dev/null \
            || : > assets.txt
          wc -l assets.txt

      - name: Clone z-packages (treeless)
        run: |
          git clone --filter=tree:0 --depth 1 \
            https://github.com/SrDicov/z-packages.git z-packages

      - name: Detect outdated
        id: detect
        run: |
          set -e
          out=$(python3 .github/scripts/check_outdated.py \
            z-packages/srcpkgs assets.txt --arch="$ARCH")
          echo "$out"
          auto=$(echo "$out" | sed -n 's/^pkgs://p')
          if [ "${{ inputs.sync_only }}" = "true" ]; then
            pkgs=""
          elif [ -n "${{ inputs.packages }}" ]; then
            pkgs=$(echo "${{ inputs.packages }}" | tr ',' ' ')
          elif [ "${{ inputs.force }}" = "true" ]; then
            pkgs=$(cd z-packages/srcpkgs && for d in */; do
              d=${d%/}; [ -L "$d" ] || [ "$d" = "xbps-triggers" ] || printf '%s ' "$d"
            done)
          else
            pkgs="$auto"
          fi
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          [ -n "$pkgs" ] || echo "All binpkgs current, build will skip."

  build:
    name: Build and publish (musl)
    needs: check
    if: needs.check.outputs.pkgs != '' || inputs.sync_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout z-repo-musl
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone z-packages (treeless)
        run: |
          rm -rf z-packages
          git clone --filter=tree:0 --depth 1 \
            https://github.com/SrDicov/z-packages.git z-packages
          echo "commit: $(git -C z-packages rev-parse --short HEAD)"

      - name: Restore xbps caches
        uses: actions/cache@v4
        with:
          path: |
            z-packages/hostdir/sources
            z-packages/hostdir/ccache
          key: musl-xbps-v1
          restore-keys: musl-xbps-

      - name: Configure z-packages (host side)
        run: |
          mkdir -p z-packages/hostdir/binpkgs/x86_64-musl \
            z-packages/hostdir/sources z-packages/hostdir/ccache
          printf '%s\n' XBPS_PRESERVE_PKGS=yes XBPS_CCACHE=yes \
            "XBPS_MAKEJOBS=$(nproc)" XBPS_ALLOW_RESTRICTED=yes \
            >> z-packages/etc/conf

      - name: Seed binpkgs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd z-packages/hostdir/binpkgs/x86_64-musl
          if gh release view "$REPO_TAG" >/dev/null 2>&1; then
            gh release download "$REPO_TAG" --pattern '*.xbps*' || true
          fi
          ls *.xbps 2>/dev/null | wc -l
          if [ "${{ inputs.resign }}" = "true" ]; then
            echo "resign requested: wiping old signatures and repodata"
            rm -f *.sig2 *.sig *-repodata*
          fi

      - name: Allow unprivileged userns (Ubuntu 24.04 fix)
        run: |
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo "no apparmor file"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true

      - name: Build packages (void-musl docker)
        id: build
        if: inputs.sync_only != 'true'
        env:
          PKGS: ${{ needs.check.outputs.pkgs }}
        run: |
          set -e
          docker run --rm --privileged \
            -v "$PWD/z-packages:/void-packages" \
            -v "$PWD/.github/scripts/build-musl.sh:/build-musl.sh:ro" \
            -e PKGS="$PKGS" \
            "$MUSL_IMAGE" /bin/sh /build-musl.sh
          failed="$(cat z-packages/failed.txt 2>/dev/null || true)"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ] || echo "FAILED packages:$failed"

      - name: Upload per-package logs (debug)
        if: steps.build.outputs.failed != ''
        uses: actions/upload-artifact@v4
        with:
          name: musl-build-logs
          path: z-packages/logs/
          retention-days: 7

      - name: Publish to release (always, even on build failure)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
          RESIGN: ${{ inputs.resign }}
        run: |
          docker run --rm --privileged \
            -v "$PWD/z-packages:/void-packages" \
            -v "$PWD/.github/scripts/publish.sh:/publish.sh:ro" \
            -e ARCH="$ARCH" -e REPO_TAG="$REPO_TAG" -e GH_REPO="$GH_REPO" \
            -e GH_TOKEN="$GH_TOKEN" -e XBPS_PRIVATE_KEY="$XBPS_PRIVATE_KEY" \
            "$MUSL_IMAGE" /bin/sh -c \
            "xbps-install -Sy bash github-cli python3 2>&1 | tail -n 1; bash /publish.sh /void-packages/hostdir/binpkgs/x86_64-musl"
          failed="$(cat z-packages/failed.txt 2>/dev/null || true)"
          [ -z "$failed" ] || { echo "FAILED packages:$failed"; exit 1; }

      - name: Save xbps caches (always, even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            z-packages/hostdir/sources
            z-packages/hostdir/ccache
          key: musl-xbps-v1-${{ github.run_id }}
