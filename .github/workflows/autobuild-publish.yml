name: "Z Repo Autobuild & Publish (musl)"

on:
  push:
    branches: [master, main]
    paths:
      - ".github/**"
      - "keys/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated list of packages to build and publish (empty for auto-detect)"
        required: false
        default: ""
  repository_dispatch:
    types: [z-packages-update]
  schedule:
    - cron: "0 3 * * *"

env:
  ARCH: x86_64-musl
  IMAGE: ghcr.io/void-linux/void-musl-full:latest
  REPO_TAG: stable
  GH_REPO: ${{ github.repository }}

concurrency:
  group: z-repo-musl-autobuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone z-packages
        run: |
          git clone --depth 1 https://github.com/SrDicov/z-packages.git z-packages

      - name: Determine packages to build
        id: planner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            PKGS="${{ github.event.inputs.packages }}"
          else
            PKGS=$(python3 .github/scripts/autopkg/cli.py plan --repo z-packages --arch "$ARCH" --limit 0 | tr '\n' ' ')
          fi
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"
          echo "Packages to process: $PKGS"

      - name: Seed Dependencies Surgically
        if: steps.planner.outputs.pkgs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ${{ steps.planner.outputs.pkgs }}; do
            python3 .github/scripts/autopkg/cli.py seed \
              --repo z-packages \
              --from-github "SrDicov/z-repo-musl" \
              --arch "$ARCH" \
              "$pkg" || true
          done

      - name: Build Packages in Isolated Container
        if: steps.planner.outputs.pkgs != ''
        run: |
          for pkg in ${{ steps.planner.outputs.pkgs }}; do
            docker run --rm --privileged \
              -v /dev:/dev \
              -v "$PWD/z-packages:/void-packages" \
              -v "$PWD/.github/scripts/autopkg:/autopkg:ro" \
              -w /void-packages \
              "$IMAGE" \
              sh -c '
                set -e
                mkdir -p etc
                echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf
                echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
                echo "XBPS_MAKEJOBS=$(nproc)" >> etc/conf
                mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ 2>/dev/null || true
                sed -i "s|repo-default|repo-ci|g" /etc/xbps.d/*-repository-*.conf 2>/dev/null || true
                xbps-install -Syu -y bash python3 sudo git curl >/dev/null 2>&1 || true
                useradd -m -d /tmp/builder -G xbuilder -s /bin/bash builder 2>/dev/null || true
                echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
                chown -R builder:builder /void-packages /tmp/builder 2>/dev/null || true
                su - builder -c "git config --global --add safe.directory /void-packages"
                su - builder -c "python3 /autopkg/cli.py build --repo /void-packages --arch '"$ARCH"' '"$pkg"'"
              ' || echo "Package build failed for $pkg: continuing"
          done

      - name: Stage Binaries
        run: |
          mkdir -p dist
          find z-packages/hostdir/binpkgs -name "*.xbps" -exec cp {} dist/ \; 2>/dev/null || true
          cp keys/*.plist dist/ 2>/dev/null || true

      - name: Sign and Index Repository
        if: env.XBPS_PRIVATE_KEY != ''
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
          SIGNED_BY: "Z Linux Core <SrDicov@gmail.com>"
        run: |
          if [ -n "$(find dist -name '*.xbps' 2>/dev/null)" ]; then
            docker run --rm --privileged \
              -v "$PWD/dist:/dist" \
              -v "$PWD/.github/scripts/autopkg:/autopkg:ro" \
              -e XBPS_PRIVATE_KEY="$XBPS_PRIVATE_KEY" \
              -e SIGNED_BY="$SIGNED_BY" \
              "$IMAGE" \
              sh -c "
                mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ 2>/dev/null || true
                sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf 2>/dev/null || true
                xbps-install -Syu -y python3 openssl >/dev/null 2>&1 || true
                python3 /autopkg/cli.py publish \
                  --binpkgs-dir /dist \
                  --arch $ARCH \
                  --backend local \
                  --dest /dist \
                  --signed-by \"\$SIGNED_BY\" \
                  --prune
              "
          fi

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(find dist -name '*.xbps' 2>/dev/null)" ]; then
            python3 .github/scripts/autopkg/cli.py publish \
              --binpkgs-dir dist \
              --arch "$ARCH" \
              --backend github \
              --dest "${{ github.repository }}" \
              --tag "$REPO_TAG" \
              --upload-only
          fi
